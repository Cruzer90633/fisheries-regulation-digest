name: Weekly fetch and summarize

# Fetches new Federal Register notices and drafts summaries once a week.
#
# It deliberately stops there. Approval is a human step, so this workflow never
# publishes: it commits the drafts and opens nothing to the public. Run `review`
# locally, then `build`, then push the site.
#
# Every run commits app/data/last-run.json, even a run that found nothing. That
# is on purpose. Without it a quiet week, a broken job and a schedule that
# stopped firing all look the same — no email, no commit, nothing. A commit
# every Monday turns "no news" into something you can actually see, and keeps
# the repository active so GitHub does not disable the schedule after 60 days.

on:
  schedule:
    # 07:17 UTC Monday — after the Friday and weekend Federal Register issues.
    #
    # Deliberately not on the hour. GitHub documents that scheduled runs can be
    # delayed, and dropped entirely, when Actions is under load, and that load
    # peaks at the start of every hour. A few minutes past is free insurance.
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to fetch"
        required: false
        default: "14"

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # continue-on-error so that a partial failure still gets committed and
      # recorded. Losing four good drafts because the fifth failed would be a
      # poor trade. The job is failed deliberately at the end instead.
      - name: Fetch and draft
        id: draft
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m app.cli run --days "${{ inputs.days || '14' }}"

      - name: Commit the run record and any new drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A app/data
          if git diff --staged --quiet; then
            echo "Nothing to commit — the run did not get far enough to record itself."
          else
            MESSAGE="$(python -m app.cli heartbeat --headline)"
            git commit -m "$MESSAGE"
            git push
          fi

      # Last, so the record is safely committed before the job goes red. A red
      # run emails you; that is the point.
      - name: Fail if the run did not complete cleanly
        if: steps.draft.outcome == 'failure'
        run: |
          echo "The draft step reported a problem. See the run summary above."
          exit 1
